<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dukes Market | سوق الدوقات</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cards.css">
</head>
<body>

<!-- إشعار إعادة الاتصال -->
<div id="reconnectBanner">⚠️ انقطع الاتصال — جاري إعادة الاتصال...</div>

<!-- Toasts -->
<div id="toastContainer"></div>

<!-- الشاشة الرئيسية -->
<div id="screen-home" class="screen">
  <div class="brand">
    <h1>🏛️ Dukes Market</h1>
    <p class="tagline">سوق الدوقات — مزايدة سرية، خيانة، وثروات مشبوهة</p>
  </div>
  <input id="nameInput" placeholder="اسمك في اللعبة" maxlength="20">
  <button id="btnCreate">+ إنشاء غرفة</button>
  <div class="row" style="margin-top:6px">
    <input id="codeInput" placeholder="رمز الغرفة" maxlength="5" style="text-transform:uppercase">
    <button id="btnJoin">انضمام</button>
  </div>
</div>

<!-- اللوبي -->
<div id="screen-lobby" class="screen hidden">
  <h2>🏛️ غرفة: <span id="roomCode" style="color:var(--gold)"></span></h2>
  <ul id="playerList"></ul>
  <button id="btnStart">▶ ابدأ اللعبة</button>
</div>

<!-- اللعب -->
<div id="screen-game" class="screen hidden">

  <!-- القطعة الأثرية -->
  <div id="artifactBox"></div>

  <!-- المؤقّت -->
  <div id="timerWrap">
    <div id="timerBar"><div id="timerFill"></div></div>
    <span id="timerText">30ث</span>
    <span id="submitCount"></span>
  </div>

  <!-- الطاولة -->
  <div id="table"></div>

  <!-- اليد -->
  <div class="panel">
    <h3>💰 ميزانيتك: <span id="budgetDisplay">0</span> عملة</h3>
    <label>مزايدة أساسية (0-10):
      <input type="number" id="bidInput" min="0" max="10" value="0">
    </label>
  </div>

  <div class="panel">
    <h3>🏦 بطاقة البنك</h3>
    <div class="cards-row" id="bankZone"></div>
  </div>

  <div class="panel">
    <h3>💵 عزّز مزايدتك (تُستهلك دائماً)</h3>
    <div class="cards-row" id="moneyCardsZone"></div>
    <p style="margin-top:6px;color:var(--gold)">إجمالي التعزيز: <strong id="boostTotal">0</strong></p>
  </div>

  <div class="panel">
    <h3>🎭 بطاقة فعل (اختياري)</h3>
    <div class="cards-row" id="actionCardsZone"></div>
    <select id="targetSelect" class="hidden" style="margin-top:6px"></select>
    <button class="ghost-btn hidden" id="ghostBtn" onclick="clearActionSelection()">إلغاء تحديد البطاقة</button>
  </div>

  <button id="btnSubmit" style="width:100%;max-width:340px;padding:14px">✅ تأكيد الجولة</button>

  <div id="log"></div>
</div>

<!-- نهاية اللعبة -->
<div id="screen-gameover" class="screen hidden">
  <h2 style="color:var(--gold);margin-bottom:16px">🏆 النتائج النهائية</h2>
  <ol id="finalList"></ol>
  <button onclick="location.reload()" style="margin-top:20px">🔄 لعبة جديدة</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="artifacts.js"></script>
<script src="card-svgs.js"></script>
<script src="app.js"></script>
</body>
</html>
